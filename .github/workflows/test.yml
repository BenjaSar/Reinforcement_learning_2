name: CI — Test & Smoke

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short -k "not smoke" --timeout=120

      - name: Smoke test — A2C (5 updates)
        run: |
          python train_a2c.py --n_updates 5 --n_steps 16 --n_envs 2 --seed 42

      - name: Smoke test — PPO (5 updates)
        run: |
          python train_ppo.py --n_updates 5 --n_steps 8 --n_envs 2 --seed 42

      - name: Smoke test — PPO + curriculum (5 updates)
        run: |
          python train_ppo.py --n_updates 5 --n_steps 8 --n_envs 2 --seed 42 --curriculum
